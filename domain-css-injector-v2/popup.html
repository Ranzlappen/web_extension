<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>CSS Injector</title>
    <style>
        body{font-family: sans-serif;max-width:100%;font-size: 20px;box-sizing:border-box;background-color: #0f121c;}
        h3{margin:0 0 8px 0}
		h4{margin:8px 0 8px 0}
		textarea{width:100%;height:160px;box-sizing:border-box;font-family:monospace}
        button{background-color: black;margin-top:8px;padding:8px 8px;width:100%}
		button:hover{background-color:#313151;cursor:pointer;}
        #list{margin-top:8px;overflow:auto;border:1px solid #eee;padding:6px}
        #domainInfo{font-size:0.9em;color:#333;margin-bottom:8px}
		#status{min-height:22px;margin-top:8px;margin-bottom:8px;}
        .hint{font-size:0.8em;color:#666;margin-bottom:8px}
        .kv{font-family:monospace;white-space:pre-wrap;padding:8px 0}
        .controls{display:flex;gap:6px}
        .controls button{flex:1;width:auto;border-radius:10px}
    </style>
</head>

<body>
        <h3>CSS Injector</h3>
        <div id="domainInfo">Detecting domain…</div>
        <div class="hint">Enter custom CSS below</div>
        <textarea id="cssInput" placeholder="Enter custom CSS for this domain
		
.class  {style:example;}
#id     {style:example;}
body    {style:example;}
*       {style:example;}"></textarea>
        <div class="controls">
            <button id="saveBtn">Save CSS changes</button>
            <button id="deleteBtn">Delete CSS for this Page</button>
			<button id="inspectBtn">Select Container</button>
        </div>
        <div id="status"></div>
		<h4>TTS Reader</h4>
		<div class="controls">
			<button id="readTextBtn">Read Selected Text</button>
			<button id="stopReadBtn">Stop Reading</button>
        </div>
		<h4>Media</h4>
		<div class="controls">
			<button id="downloadVideoBtn">Download Video Media</button>
		</div>
		<div id="videoPicker" style="display:none;margin-top:8px;">
			<select id="videoSelect" style="width:100%;padding:8px;margin-bottom:6px;"></select>
			<div class="controls">
				<button id="confirmVideoDownloadBtn">Download Selected Video</button>
				<button id="cancelVideoDownloadBtn">Cancel</button>
			</div>
		</div>
        <h4>Saved snippets</h4>
        <div class="controls">
            <button id="refreshBtn">Refresh list</button>
            <button id="exportBtn">Export JSON</button>
        </div>
        <div id="list"></div>
    <script src="popup.js"></script>
</body>

</html>
