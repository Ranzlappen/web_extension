<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>CSS Injector</title>
    <style>
        :root{color-scheme:dark;}
        body{font-family: sans-serif;min-width:320px;max-width:100%;font-size: 20px;box-sizing:border-box;background-color: #0f121c;color:#e6e8ef;margin:0;padding:12px;}
        h3{margin:0 0 8px 0}
		h4{margin:8px 0 8px 0}
		textarea{width:100%;height:160px;box-sizing:border-box;font-family:monospace;background-color:#161a26;color:#e6e8ef;border:1px solid #2a2f44;border-radius:6px;padding:8px;}
        button{background-color: black;color:#fff;border:1px solid #2a2f44;margin-top:8px;padding:10px 8px;width:100%;min-height:44px;border-radius:8px;}
		button:hover{background-color:#313151;cursor:pointer;}
        #list{margin-top:8px;overflow:auto;border:1px solid #2a2f44;padding:6px;border-radius:6px;}
        #domainInfo{font-size:0.9em;color:#cfd2dc;margin-bottom:8px}
		#status{min-height:22px;margin-top:8px;margin-bottom:8px;color:#cfd2dc;}
        .hint{font-size:0.8em;color:#9aa3b2;margin-bottom:8px}
        .kv{font-family:monospace;white-space:pre-wrap;padding:8px 0}
        .controls{display:flex;gap:6px;flex-wrap:wrap}
        .controls button{flex:1 1 120px;width:auto;border-radius:10px}
    </style>
</head>

<body>
        <h3>CSS Injector</h3>
        <div id="domainInfo">Detecting domain…</div>
        <div class="hint">Enter custom CSS below</div>
        <textarea id="cssInput" placeholder="Enter custom CSS for this domain

.class  {style:example;}
#id     {style:example;}
body    {style:example;}
*       {style:example;}"></textarea>
        <div class="controls">
            <button id="saveBtn">Save CSS changes</button>
            <button id="deleteBtn">Delete CSS for this Page</button>
			<button id="inspectBtn">Select Container</button>
        </div>
        <div id="status"></div>
		<h4>TTS Reader</h4>
		<div class="controls">
			<button id="readTextBtn">Read Selected Text</button>
			<button id="stopReadBtn">Stop Reading</button>
        </div>
		<h4>Media</h4>
		<div class="controls">
			<button id="downloadVideoBtn">Download Video Media</button>
		</div>
        <h4>Saved snippets</h4>
        <div class="controls">
            <button id="refreshBtn">Refresh list</button>
            <button id="exportBtn">Export JSON</button>
        </div>
        <div id="list"></div>
    <script src="popup.js"></script>
</body>

</html>
