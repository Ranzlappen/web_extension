# Production release builds for the unpacked extension. Packages
# domain-css-injector-v2/ into two distributable .zips and attaches them to a
# GitHub Release: the Manifest V3 build (desktop Chrome/Edge/Opera/Firefox) and
# a Manifest V2 "-kiwi" build for Kiwi / Android Chromium forks (which only
# support MV2 reliably). The MV2 manifest is derived from the MV3 manifest, so
# the only "build step" is that manifest transform — the JS ships unchanged.
#
# Triggers:
#   * workflow_dispatch -> fully automated release. Pick a bump level
#       (patch / minor / major); the workflow increments manifest.json,
#       commits the bump, creates the matching vX.Y.Z tag, and publishes the
#       GitHub Release — no manual version editing or tagging required.
#   * tag push  matching v*  -> explicit release at the pushed tag (no bump).
#
# Note: the dispatch path pushes the version-bump commit + tag back to the
# branch it runs on. Run it on a branch the Actions token can push to (a
# protected default branch will reject the bump commit). The bump commit is
# marked [skip ci] so it does not re-trigger CI.
#
# Required secrets: none (uses GITHUB_TOKEN for commits, tags, and releases).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump level"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package-extension:
    name: Package extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Resolve version and tag
        id: meta
        run: |
          set -e
          MANIFEST=domain-css-injector-v2/manifest.json
          CURRENT=$(node -e "console.log(require('./$MANIFEST').version)")
          NAME=$(node -e "console.log(require('./$MANIFEST').name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-\$/g,''))")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
            BUMP=false
          else
            LEVEL="${{ github.event.inputs.release_type }}"
            LEVEL="${LEVEL:-patch}"
            VERSION=$(node -e "
              const parts='${CURRENT}'.split('.').map(n=>parseInt(n,10)||0);
              let [maj=0,min=0,pat=0]=parts;
              if('${LEVEL}'==='major'){maj++;min=0;pat=0;}
              else if('${LEVEL}'==='minor'){min++;pat=0;}
              else{pat++;}
              console.log([maj,min,pat].join('.'));
            ")
            TAG="v${VERSION}"
            BUMP=true
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP"       >> "$GITHUB_OUTPUT"
          echo "name=$NAME"       >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG (bump=$BUMP, current=$CURRENT)"

      - name: Bump manifest version, commit and tag
        if: steps.meta.outputs.bump == 'true'
        run: |
          set -e
          node -e "
            const fs=require('fs');
            const p='domain-css-injector-v2/manifest.json';
            const m=JSON.parse(fs.readFileSync(p,'utf8'));
            m.version='${{ steps.meta.outputs.version }}';
            fs.writeFileSync(p, JSON.stringify(m,null,2)+'\n');
          "
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add domain-css-injector-v2/manifest.json
          git commit -m "Release ${{ steps.meta.outputs.tag }} [skip ci]"
          git tag -a "${{ steps.meta.outputs.tag }}" -m "Release ${{ steps.meta.outputs.tag }}"
          for i in 1 2 3 4; do
            git push origin "HEAD:${GITHUB_REF_NAME}" "${{ steps.meta.outputs.tag }}" && break
            echo "push failed, retry $i"; sleep $((2 ** i))
          done

      - name: Validate manifest.json is valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('domain-css-injector-v2/manifest.json', 'utf8'))"

      - name: Syntax-check JavaScript sources
        run: |
          set -e
          for f in domain-css-injector-v2/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Confirm icons referenced by manifest exist
        run: |
          set -e
          for size in 16 48 128; do
            test -f "domain-css-injector-v2/icons/icon${size}.png" \
              || { echo "Missing icon: icons/icon${size}.png"; exit 1; }
          done

      - name: Build production zip
        id: build
        run: |
          set -e
          OUT="${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}.zip"
          mkdir -p dist
          (cd domain-css-injector-v2 && zip -r "../dist/$OUT" . -x "*.DS_Store" "Thumbs.db")
          echo "artifact=dist/$OUT" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Verify manifest.json is at the zip root
        run: |
          set -e
          # Stores (AMO, Chrome Web Store) require manifest.json at the archive
          # root, not nested in a containing folder. Fail loudly if it drifts.
          if ! unzip -l "${{ steps.build.outputs.artifact }}" | grep -qE ' manifest\.json$'; then
            echo "::error::manifest.json is not at the root of the zip. The archive must contain the extension's files directly, not a wrapping folder."
            unzip -l "${{ steps.build.outputs.artifact }}"
            exit 1
          fi
          echo "manifest.json found at zip root."

      # Kiwi Browser (and other Android Chromium forks) only support Manifest V2
      # reliably, so ship a parallel MV2 build. The MV2 manifest is derived from
      # the MV3 manifest by tools/build-kiwi-manifest.mjs (single source of
      # truth — no version drift); the same JS runs under both manifests.
      - name: Build Kiwi (Manifest V2) zip
        id: build_kiwi
        run: |
          set -e
          bash tools/build-kiwi-zip.sh dist
          OUT="dist/${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}-kiwi.zip"
          test -f "$OUT" || { echo "::error::Kiwi zip not produced at $OUT"; ls -la dist; exit 1; }
          echo "artifact=$OUT" >> "$GITHUB_OUTPUT"
          # The zip's root manifest must be valid MV2 at the matching version.
          node -e "
            const cp=require('child_process');
            const m=JSON.parse(cp.execSync('unzip -p \"$OUT\" manifest.json').toString());
            if(m.manifest_version!==2){console.error('::error::Kiwi manifest is not v2');process.exit(1);}
            if(m.version!=='${{ steps.meta.outputs.version }}'){console.error('::error::Kiwi version drift');process.exit(1);}
            console.log('Kiwi zip OK: MV2, version '+m.version);
          "

      # The Chrome Web Store upload is a third, derived zip: same MV3 source
      # with the Capture/Media features and their permissions stripped (see
      # tools/build-store-package.mjs). Upload THIS one to the dashboard.
      - name: Build Chrome Web Store zip
        id: build_store
        run: |
          set -e
          bash tools/build-store-zip.sh dist
          OUT="dist/${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}-store.zip"
          test -f "$OUT" || { echo "::error::Store zip not produced at $OUT"; ls -la dist; exit 1; }
          echo "artifact=$OUT" >> "$GITHUB_OUTPUT"
          node -e "
            const cp=require('child_process');
            const m=JSON.parse(cp.execSync('unzip -p \"$OUT\" manifest.json').toString());
            if(m.manifest_version!==3){console.error('::error::Store manifest is not v3');process.exit(1);}
            if(m.version!=='${{ steps.meta.outputs.version }}'){console.error('::error::Store version drift');process.exit(1);}
            if((m.permissions||[]).includes('downloads')){console.error('::error::downloads not stripped');process.exit(1);}
            console.log('Store zip OK: MV3, version '+m.version);
          "

      # NOTE: Downloading these artifacts from the Actions UI re-zips them
      # (GitHub wraps artifacts), producing a zip-in-zip with no manifest at the
      # root. For store/AMO uploads or sideloading on Kiwi, use the assets
      # attached to the GitHub Release (created below), or build the zip locally.
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.build.outputs.artifact }}
            ${{ steps.build_kiwi.outputs.artifact }}
            ${{ steps.build_store.outputs.artifact }}
          if-no-files-found: error

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.meta.outputs.tag }}
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            ${{ steps.build.outputs.artifact }}
            ${{ steps.build_kiwi.outputs.artifact }}
            ${{ steps.build_store.outputs.artifact }}
          generate_release_notes: true
