# Lightweight validation for the unpacked extension. No build step exists;
# this workflow just confirms the extension is still loadable: manifest is
# valid JSON, JS files parse, and every icon referenced in the manifest
# actually exists on disk.
#
# Required secrets: none.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "domain-css-injector-v2/**"
      - "tools/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "domain-css-injector-v2/**"
      - "tools/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-extension:
    name: Validate extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Validate manifest.json is valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('domain-css-injector-v2/manifest.json', 'utf8'))"

      - name: Syntax-check JavaScript sources
        run: |
          set -e
          for f in domain-css-injector-v2/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Confirm icons referenced by manifest exist
        run: |
          set -e
          for size in 16 48 128; do
            test -f "domain-css-injector-v2/icons/icon${size}.png" \
              || { echo "Missing icon: icons/icon${size}.png"; exit 1; }
          done

      - name: Validate derived Kiwi (Manifest V2) manifest
        run: |
          set -e
          node tools/build-kiwi-manifest.mjs domain-css-injector-v2/manifest.json > /tmp/kiwi-manifest.json
          node -e "
            const fs=require('fs');
            const mv3=JSON.parse(fs.readFileSync('domain-css-injector-v2/manifest.json','utf8'));
            const k=JSON.parse(fs.readFileSync('/tmp/kiwi-manifest.json','utf8'));
            const fail=(m)=>{console.error('::error::'+m);process.exit(1);};
            if(k.manifest_version!==2) fail('Kiwi manifest must be manifest_version 2');
            if(k.version!==mv3.version) fail('Kiwi/MV3 version drift');
            if(k.name!==mv3.name) fail('Kiwi/MV3 name drift');
            if(!k.browser_action||!k.browser_action.default_popup) fail('Kiwi browser_action.default_popup missing');
            if((k.permissions||[]).includes('scripting')) fail(\"'scripting' is invalid in MV2\");
            if(!(k.permissions||[]).includes('<all_urls>')) fail('MV2 build needs <all_urls> host permission');
            if(!k.background||k.background.persistent!==false) fail('MV2 background must be a non-persistent event page');
            console.log('Kiwi MV2 manifest OK (v'+k.version+')');
          "

      - name: Validate derived Chrome Web Store package
        run: |
          set -e
          # Builds the stripped store package (Capture/Media removed) and runs
          # its internal checks: stripped JS still parses, no stripped symbol
          # or permission remains referenced.
          node tools/build-store-package.mjs /tmp/store-pkg
          node -e "
            const fs=require('fs');
            const mv3=JSON.parse(fs.readFileSync('domain-css-injector-v2/manifest.json','utf8'));
            const s=JSON.parse(fs.readFileSync('/tmp/store-pkg/manifest.json','utf8'));
            const fail=(m)=>{console.error('::error::'+m);process.exit(1);};
            if(s.manifest_version!==3) fail('Store manifest must be manifest_version 3');
            if(s.version!==mv3.version) fail('Store/MV3 version drift');
            if(s.name!==mv3.name) fail('Store/MV3 name drift');
            for(const p of ['downloads','contextMenus'])
              if((s.permissions||[]).includes(p)) fail(p+' must be stripped from the store build');
            for(const k of ['background','sidebar_action','browser_specific_settings'])
              if(k in s) fail(k+' must be stripped from the store manifest');
            if(fs.existsSync('/tmp/store-pkg/background.js')) fail('background.js must not ship in the store build');
            console.log('Store package OK (v'+s.version+')');
          "
